name: Five-year non-shooter net rating

on:
  push:
    paths:
      - '.github/workflows/nonshooter-netrating-5yr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - name: Build pooled five-season leaderboard
        run: |
          cat > build.py <<'PY'
          import json, math, random, time
          import pandas as pd
          import requests

          SEASONS=["2021-22","2022-23","2023-24","2024-25","2025-26"]
          URL="https://api.pbpstats.com/get-totals/nba"
          HEADERS={
            "Accept":"application/json, text/plain, */*",
            "Origin":"https://www.pbpstats.com",
            "Referer":"https://www.pbpstats.com/",
            "User-Agent":"Mozilla/5.0 AppleWebKit/537.36 Chrome/131 Safari/537.36",
          }

          def fetch(season):
            params={"Season":season,"SeasonType":"Regular Season","Type":"Player"}
            err=None
            for attempt in range(1,7):
              try:
                r=requests.get(URL,params=params,headers=HEADERS,timeout=(10,90))
                if r.status_code in (429,500,502,503,504):
                  raise RuntimeError(f"HTTP {r.status_code}")
                r.raise_for_status()
                rows=(r.json().get("multi_row_table_data") or [])
                print(f"{season}: {len(rows)} player rows",flush=True)
                return rows
              except Exception as e:
                err=repr(e)
                if attempt<6: time.sleep(min(2**(attempt-1),8)+random.random())
            raise RuntimeError(f"{season} failed: {err}")

          rows=[]
          for season in SEASONS:
            for x in fetch(season):
              pid=str(x.get("EntityId") or x.get("RowId") or x.get("PlayerId") or "").strip()
              name=str(x.get("Name") or x.get("ShortName") or "").strip()
              if not pid or not name: continue
              def num(k):
                try:
                  v=float(x.get(k))
                  return v if math.isfinite(v) else None
                except: return None
              mins=num("Minutes")
              if mins is None:
                sec=num("SecondsPlayed"); mins=(sec/60 if sec is not None else None)
              rows.append({
                "season":season,"player_id":pid,"player_name":name,
                "minutes":mins,"fg3a":num("FG3A") or 0.0,
                "off_poss":num("OffPoss"),"def_poss":num("DefPoss"),
                "ortg":num("OnOffRtg"),"drtg":num("OnDefRtg"),
                "team_id":str(x.get("TeamId") or ""),"team":str(x.get("TeamAbbreviation") or ""),
              })

          d=pd.DataFrame(rows)
          d.to_csv("season_source_rows.csv",index=False)

          q=d[(d.minutes>0)&(d.off_poss>0)&(d.def_poss>0)&d.ortg.notna()&d.drtg.notna()].copy()
          q["off_points_equiv"]=q.ortg*q.off_poss/100.0
          q["def_points_equiv"]=q.drtg*q.def_poss/100.0

          def name_last(s):
            vals=list(dict.fromkeys(str(v) for v in s if pd.notna(v) and str(v)))
            return vals[-1] if vals else ""

          g=q.groupby("player_id",as_index=False).agg(
            player_name=("player_name",name_last),
            seasons_played=("season","nunique"),
            minutes=("minutes","sum"),
            fg3a=("fg3a","sum"),
            off_poss=("off_poss","sum"),
            def_poss=("def_poss","sum"),
            off_points_equiv=("off_points_equiv","sum"),
            def_points_equiv=("def_points_equiv","sum"),
          )
          g["pooled_ortg"]=100*g.off_points_equiv/g.off_poss
          g["pooled_drtg"]=100*g.def_points_equiv/g.def_poss
          g["pooled_net_rating"]=g.pooled_ortg-g.pooled_drtg
          g["fg3a"]=g.fg3a.round().astype(int)
          g=g[g.fg3a<20].copy()
          g=g.sort_values(["pooled_net_rating","minutes"],ascending=[False,False]).reset_index(drop=True)
          g.insert(0,"rank",range(1,len(g)+1))
          cols=["rank","player_name","player_id","pooled_net_rating","pooled_ortg","pooled_drtg","fg3a","minutes","off_poss","def_poss","seasons_played"]
          raw=g[cols]
          raw.to_csv("nonshooters_under20_3pa_5yr_all.csv",index=False)
          raw.head(20).to_csv("top20_raw.csv",index=False)

          qual=g[g.minutes>=3000].copy().reset_index(drop=True)
          qual["rank"]=range(1,len(qual)+1)
          qual[cols].head(20).to_csv("top20_min3000.csv",index=False)

          summary={
            "seasons":SEASONS,
            "source":"PBP Stats get-totals/nba, Type=Player, Regular Season",
            "filter":"sum(FG3A) < 20 across 2021-22 through 2025-26",
            "ranking":"pooled on-court net rating",
            "pooling":"pooled ORtg = sum(OnOffRtg*OffPoss)/sum(OffPoss); pooled DRtg = sum(OnDefRtg*DefPoss)/sum(DefPoss); net = ORtg-DRtg",
            "season_rows":len(d),
            "eligible_players":len(g),
          }
          with open("summary.json","w") as f: json.dump(summary,f,indent=2)

          print("\nSUMMARY\n"+json.dumps(summary,indent=2))
          print("\nTOP20_RAW")
          print(raw.head(20).to_csv(index=False))
          print("\nTOP20_MIN3000")
          print(qual[cols].head(20).to_csv(index=False))
          PY
          python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonshooter-netrating-5yr
          path: |
            top20_raw.csv
            top20_min3000.csv
            nonshooters_under20_3pa_5yr_all.csv
            season_source_rows.csv
            summary.json
